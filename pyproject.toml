[project]
name = "nyc-activities"
version = "0.1.0"
description = "NYC activities data pipeline: ingestion -> Postgres -> dbt marts -> FastAPI"
requires-python = ">=3.11"

# Runtime dependencies for both components. They share one venv and the same
# Postgres, so they're declared together rather than split across two files --
# see the note that used to live at the top of ingestion/requirements.txt.
dependencies = [
    # --- ingestion ---
    "pandas",              # read CSVs into DataFrames; robust date parsing (pd.to_datetime)
    "SQLAlchemy>=2.0",     # DB-agnostic engine/table definitions + upsert (Postgres in prod, SQLite in tests)
    "psycopg[binary]",     # Postgres driver used via SQLAlchemy's postgresql+psycopg dialect
    "python-dotenv",       # loads .env into the environment for local `make ingest` runs
    "requests",            # HTTP client for the NYC Parks API, with explicit timeouts

    # --- dbt (analytics layer under dbt/) ---
    "dbt-core",
    "dbt-postgres",

    # --- backend (FastAPI app) ---
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
]

# Test + lint tooling. Installed by `uv sync`, excluded from `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest",
    "httpx",               # FastAPI TestClient transport
    "ruff",
    "sqlfluff",
    "sqlfluff-templater-dbt",
]

# This repo is run as scripts/modules (`python -m ingestion`, `uvicorn app.main:app`),
# not installed as a distribution -- so don't try to build it.
[tool.uv]
package = false

# Pinned explicitly rather than riding ruff's defaults: 0.16 widened the default
# set (UP, I, B, DTZ, C4...) and turned a clean tree into 105 findings overnight.
# This is the set the project was actually linting under. Opting into the newer
# rules is worth doing -- but as a deliberate, separate pass.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "backend/tests"]
# `ingestion.*` resolves from the repo root, `app.*` from backend/. The Makefile
# targets get this implicitly via `python -m pytest`; setting it here means a
# bare `pytest` (or `uv run pytest`) works from the root too.
pythonpath = [".", "backend"]
