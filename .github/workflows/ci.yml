name: CI

# The goal here isn't a fancy pipeline -- it's that every PR proves the data
# model still holds: lint, unit tests, then load real fixture data through
# ingestion and rebuild+test the dbt mart against it.
on:
  pull_request:
  push:
    branches: [main]

env:
  POSTGRES_USER: nyc_activities
  POSTGRES_PASSWORD: nyc_activities
  POSTGRES_DB: nyc_activities
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql+psycopg://nyc_activities:nyc_activities@localhost:5432/nyc_activities

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyc_activities
          POSTGRES_PASSWORD: nyc_activities
          POSTGRES_DB: nyc_activities
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyc_activities"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # uv reads the Python version from .python-version and installs the exact
      # locked dependency set, so CI runs what a contributor runs locally.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: sqlfluff lint (dbt models)
        working-directory: dbt
        run: uv run sqlfluff lint models --dialect postgres

      - name: docker compose config
        run: docker compose config

      - name: pytest (ingestion)
        run: uv run python -m pytest ingestion/tests

      - name: pytest (backend)
        working-directory: backend
        run: uv run python -m pytest tests

      - name: frontend build (compile check)
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Load fixture data (ingestion)
        run: uv run python -m ingestion

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps --profiles-dir .

      - name: dbt seed
        working-directory: dbt
        run: uv run dbt seed --profiles-dir .

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
