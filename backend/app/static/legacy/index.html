<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NYC Activity Discovery Engine</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    form { display: grid; gap: 0.75rem; margin-bottom: 2rem; }
    label { font-size: 0.9rem; font-weight: 600; }
    select, input, button { font-size: 1rem; padding: 0.4rem; }
    button { cursor: pointer; background: #111; color: white; border: none; border-radius: 4px; padding: 0.6rem; }
    .mode-group { display: flex; gap: 1rem; align-items: center; }
    .mode-group label { font-weight: 400; display: flex; align-items: center; gap: 0.3rem; }
    #vibe-field { display: none; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .card h3 { margin: 0 0 0.25rem 0; }
    .meta { color: #555; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .badge { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 999px; background: #eee; color: #333; }
    .badge.confidence-high { background: #d7f5da; color: #1a5c22; }
    .badge.confidence-medium { background: #fdf1cf; color: #7a5b00; }
    .badge.confidence-low { background: #fbdada; color: #7a1b1b; }
    .explanation { font-size: 0.9rem; color: #333; }
    .empty { color: #777; font-style: italic; }
  </style>
</head>
<body>
  <h1>NYC Activity Discovery Engine</h1>
  <p>Tell us your constraints, get a few real, feasible activities -- not a catalog.</p>

  <form id="constraint-form">
    <div>
      <label for="zip_code">Starting ZIP code</label><br />
      <input id="zip_code" type="text" inputmode="numeric" placeholder="e.g. 10003" />
    </div>

    <div class="mode-group">
      <label><input type="radio" name="mode" value="specific" checked /> Specific category</label>
      <label><input type="radio" name="mode" value="mood" /> Match a mood</label>
      <label><input type="radio" name="mode" value="surprise" /> Surprise me</label>
    </div>

    <div id="category-field">
      <label for="category">Category</label><br />
      <select id="category">
        <option value="">Any</option>
        <option value="sports">Sports</option>
        <option value="outdoors">Outdoors</option>
        <option value="volunteering">Volunteering</option>
        <option value="language_exchange">Language exchange</option>
        <option value="arts">Arts</option>
      </select>
    </div>

    <div id="vibe-field">
      <label for="vibe">Vibe</label><br />
      <select id="vibe">
        <option value="chill">Chill</option>
        <option value="energetic">Energetic</option>
        <option value="social">Social</option>
        <option value="solo_focus">Solo-focused</option>
        <option value="creative">Creative</option>
      </select>
    </div>

    <div>
      <label for="max_cost">Max budget ($)</label><br />
      <input id="max_cost" type="number" min="0" placeholder="e.g. 10" />
    </div>
    <div>
      <label><input id="solo_friendly" type="checkbox" /> Solo-friendly only</label>
    </div>
    <div>
      <label for="date">Date</label><br />
      <input id="date" type="date" />
    </div>
    <button type="submit">Find activities</button>
  </form>

  <div id="results"></div>

  <script>
    const form = document.getElementById('constraint-form');
    const results = document.getElementById('results');
    const categoryField = document.getElementById('category-field');
    const vibeField = document.getElementById('vibe-field');
    const modeRadios = document.querySelectorAll('input[name="mode"]');

    function syncModeFields() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      categoryField.style.display = mode === 'specific' ? '' : 'none';
      vibeField.style.display = mode === 'mood' ? '' : 'none';
    }
    modeRadios.forEach((radio) => radio.addEventListener('change', syncModeFields));
    syncModeFields();

    function confidenceClass(label) {
      return `confidence-${String(label).toLowerCase()}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const params = new URLSearchParams();
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const category = document.getElementById('category').value;
      const vibe = document.getElementById('vibe').value;
      const zipCode = document.getElementById('zip_code').value;
      const maxCost = document.getElementById('max_cost').value;
      const soloFriendly = document.getElementById('solo_friendly').checked;
      const date = document.getElementById('date').value;

      params.set('mode', mode);
      if (mode === 'specific' && category) params.set('category', category);
      if (mode === 'mood') params.set('vibe', vibe);
      if (zipCode) params.set('zip_code', zipCode);
      if (maxCost) params.set('max_cost', maxCost);
      if (soloFriendly) params.set('solo_friendly', 'true');
      if (date) params.set('date', date);

      results.innerHTML = 'Searching...';
      let data;
      try {
        const res = await fetch(`/recommendations?${params.toString()}`);
        if (!res.ok) {
          throw new Error(`Server returned ${res.status}`);
        }
        data = await res.json();
      } catch (err) {
        results.innerHTML = `<p class="empty">Something went wrong: ${err.message}. Make sure you're viewing this page at http://localhost:8000, not through a separate dev server.</p>`;
        return;
      }

      if (!data.length) {
        results.innerHTML = '<p class="empty">No feasible activities match those constraints right now.</p>';
        return;
      }

      results.innerHTML = data.map(item => `
        <div class="card">
          <h3>${item.title}</h3>
          <div class="meta">
            ${item.category} &middot; ${new Date(item.start_time).toLocaleString()} &middot;
            $${item.cost} &middot; ${item.location} &middot;
            ${item.solo_friendly ? 'Solo-friendly' : 'Group activity'}
            ${item.distance_miles !== null ? ` &middot; ${item.distance_miles} mi away` : ''}
          </div>
          <div class="badges">
            <span class="badge">Score ${item.score}/100</span>
            <span class="badge ${confidenceClass(item.confidence_label)}">Confidence: ${item.confidence_label}</span>
            <span class="badge">Source: ${item.source_name}</span>
            <span class="badge">Verified ${item.source_verified_date}</span>
          </div>
          <div class="explanation">${item.explanation}</div>
          ${item.source_url ? `<p><a href="${item.source_url}" target="_blank" rel="noopener">Source link</a></p>` : ''}
        </div>
      `).join('');
    });
  </script>
</body>
</html>
